<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigPulse - Modern Freelance Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-xl flex items-center justify-center w-10 h-10 shadow-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">GigPulse</span>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Live API
                </span>
            </div>
            <button onclick="openPostJobModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md flex items-center space-x-2">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Post a Job</span>
            </button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="bg-gradient-to-r from-indigo-900 to-violet-900 rounded-3xl p-6 sm:p-12 text-white mb-8 shadow-xl">
            <h1 class="text-2xl sm:text-4xl font-black mb-3">Find top freelance talent or post your gig.</h1>
            <p class="text-indigo-200 text-sm sm:text-base mb-6">Connect instantly with professionals and clients in real-time.</p>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterJobs()" placeholder="Search jobs by title or skill..." class="w-full pl-11 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-200 outline-none backdrop-blur-sm">
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Live Job Feed</h2>
            <span id="jobCount" class="text-xs text-slate-500 font-medium">Loading...</span>
        </div>

        <div id="jobsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Loading live jobs...</p>
            </div>
        </div>
    </main>

    <!-- Post Job Modal -->
    <div id="postJobModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl border border-slate-200 dark:border-slate-700 m-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Post a New Project</h3>
                <button onclick="closePostJobModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="postJobForm" onsubmit="submitJob(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">Job Title</label>
                    <input type="text" id="jobTitle" required placeholder="e.g. Website Developer Needed" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold mb-1">Company / Name</label>
                        <input type="text" id="jobCompany" required placeholder="e.g. Ali Transports" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Budget ($ / PKR)</label>
                        <input type="text" id="jobBudget" required placeholder="e.g. $200 / Rs 50,000" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Skills Needed</label>
                    <input type="text" id="jobSkills" required placeholder="HTML, CSS, JavaScript" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Description</label>
                    <textarea id="jobDesc" rows="3" required placeholder="Job details..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closePostJobModal()" class="px-4 py-2 rounded-xl border text-xs font-medium">Cancel</button>
                    <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-xs font-semibold">Publish Live</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Ultra-Fast API Script -->
    <script>
        const API_URL = "https://gigpulse-app-default-rtdb.firebaseio.com/jobs.json";
        let allJobs = [];

        async function fetchJobs() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                allJobs = [];
                if (data) {
                    Object.keys(data).forEach(id => {
                        allJobs.push({ id, ...data[id] });
                    });
                    allJobs.reverse();
                }
                renderJobs(allJobs);
            } catch (err) {
                console.error(err);
                document.getElementById('jobsContainer').innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Failed to load jobs.</div>`;
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            document.getElementById('jobCount').innerText = `${jobs.length} Active Listings`;

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <p class="text-slate-500 font-medium text-sm">No jobs posted yet. Be the first!</p>
                    </div>`;
                return;
            }

            container.innerHTML = jobs.map(job => {
                const skillsHtml = job.skills ? job.skills.split(',').map(s => `<span class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-xs px-2 py-0.5 rounded font-medium">${s.trim()}</span>`).join('') : '';
                return `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase">${job.company || 'Client'}</span>
                                    <h3 class="text-base font-bold text-slate-900 dark:text-white">${job.title}</h3>
                                </div>
                                <span class="bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 font-bold px-2.5 py-1 rounded-lg text-xs">${job.budget}</span>
                            </div>
                            <p class="text-slate-600 dark:text-slate-300 text-xs mb-3">${job.description}</p>
                            <div class="flex flex-wrap gap-1 mb-4">${skillsHtml}</div>
                        </div>
                        <button onclick="alert('Proposal submitted for: ${job.title}')" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-semibold text-xs hover:bg-indigo-700 transition-all">
                            Apply Now
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function submitJob(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Publishing...";
            btn.disabled = true;

            const newJob = {
                title: document.getElementById('jobTitle').value,
                company: document.getElementById('jobCompany').value,
                budget: document.getElementById('jobBudget').value,
                skills: document.getElementById('jobSkills').value,
                description: document.getElementById('jobDesc').value,
                createdAt: new Date().toISOString()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newJob)
                });

                if (res.ok) {
                    document.getElementById('postJobForm').reset();
                    closePostJobModal();
                    fetchJobs();
                } else {
                    alert('Failed to publish. Please check Firebase rules.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.innerText = "Publish Live";
                btn.disabled = false;
            }
        }

        function openPostJobModal() { document.getElementById('postJobModal').classList.remove('hidden'); }
        function closePostJobModal() { document.getElementById('postJobModal').classList.add('hidden'); }

        function filterJobs() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allJobs.filter(j => 
                j.title.toLowerCase().includes(text) || 
                (j.skills && j.skills.toLowerCase().includes(text))
            );
            renderJobs(filtered);
        }

        // Auto load jobs on start & refresh every 10 sec
        fetchJobs();
        setInterval(fetchJobs, 10000);
    </script>
</body>
</html>
