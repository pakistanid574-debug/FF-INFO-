<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpSec - Live Social & Secret Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darker: '#0f172a', card: '#1e293b' }
                }
            }
        }
    </script>
</head>
<body class="bg-darker text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white p-2 rounded-xl font-bold flex items-center justify-center w-9 h-9 shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-users-viewfinder text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight flex items-center gap-2">
                    CorpSec Live
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Sync Active</span>
                </h1>
                <p class="text-xs text-slate-400" id="currentProfileDisplay">Profile: Not Set</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleProfilesDrawer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl border border-slate-700 font-medium transition-all flex items-center space-x-1.5">
                <i class="fa-solid fa-user-group text-emerald-400"></i>
                <span>Active Profiles</span>
            </button>
            <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-slate-700 text-xs p-2 rounded-xl border border-slate-700 text-slate-300">
                <i class="fa-solid fa-user-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Live Chat Area -->
    <main id="chatContainer" class="flex-grow overflow-y-auto p-4 space-y-4 bg-slate-950/50">
        <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-500"></i>
            <p class="text-sm">Connecting to live cloud network...</p>
        </div>
    </main>

    <!-- Message & Gallery Upload Input Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3">
        <form id="chatForm" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex items-center gap-2">
            <!-- Mobile Gallery File Input -->
            <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-3 rounded-xl border border-slate-700 transition-all flex items-center justify-center cursor-pointer" title="Upload from Gallery">
                <i class="fa-solid fa-paperclip text-emerald-400"></i>
                <input type="file" id="galleryFileInput" accept="image/*" class="hidden" onchange="uploadFromGallery(event)">
            </label>

            <input type="text" id="messageInput" autocomplete="off" placeholder="Type a message or share photo..." class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
            
            <button type="submit" id="sendBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-semibold text-sm shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <!-- Active Profiles & Friend Requests Drawer Modal -->
    <div id="profilesDrawer" class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border-l border-slate-800 w-full max-w-sm h-full p-5 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <i class="fa-solid fa-address-book text-emerald-400"></i> Live Profiles
                    </h3>
                    <button onclick="toggleProfilesDrawer()" class="text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div id="profilesList" class="space-y-3 overflow-y-auto max-h-[75vh]">
                    <p class="text-xs text-slate-500 text-center">Loading profiles...</p>
                </div>
            </div>
            <div class="text-xs text-slate-500 text-center border-t border-slate-800 pt-3">
                CorpSec Realtime Directory
            </div>
        </div>
    </div>

    <!-- Profile Setup Modal -->
    <div id="profileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl m-4">
            <h3 class="text-lg font-bold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-emerald-400"></i> Set Your Profile
            </h3>
            <p class="text-xs text-slate-400 mb-4">Set your details so everyone can see your status live.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Full Name</label>
                    <input type="text" id="userNameInput" placeholder="e.g. Ali" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Role / Department</label>
                    <input type="text" id="userDeptInput" placeholder="e.g. Operations Manager" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500">
                </div>
                <button type="button" onclick="saveProfile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-semibold text-sm mt-2 transition-all">
                    Save & Go Live
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Realtime Engine -->
    <script>
        const DB_BASE = "https://gigpulse-app-default-rtdb.firebaseio.com/";
        
        let currentUser = localStorage.getItem('corp_user_name') || "";
        let currentDept = localStorage.getItem('corp_user_dept') || "";
        let allProfiles = {};

        window.onload = function() {
            if (!currentUser) {
                openProfileModal();
            } else {
                updateProfileDisplay();
                updateUserHeartbeat();
            }
            fetchLiveChat();
            fetchProfiles();
            
            // Sync loops
            setInterval(fetchLiveChat, 3000);
            setInterval(fetchProfiles, 5000);
            setInterval(updateUserHeartbeat, 15000); // Heartbeat for Last Seen
        };

        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
            if(currentUser) document.getElementById('userNameInput').value = currentUser;
            if(currentDept) document.getElementById('userDeptInput').value = currentDept;
        }

        async function saveProfile() {
            const name = document.getElementById('userNameInput').value.trim();
            const dept = document.getElementById('userDeptInput').value.trim();
            if(!name) { alert("Please enter your name!"); return; }
            
            currentUser = name;
            currentDept = dept || "General";
            localStorage.setItem('corp_user_name', currentUser);
            localStorage.setItem('corp_user_dept', currentDept);

            updateProfileDisplay();
            await updateUserHeartbeat();
            document.getElementById('profileModal').classList.add('hidden');
        }

        function updateProfileDisplay() {
            document.getElementById('currentProfileDisplay').innerText = `Me: ${currentUser} (${currentDept})`;
        }

        // Live Heartbeat & Last Seen Tracker
        async function updateUserHeartbeat() {
            if(!currentUser) return;
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const profileData = {
                name: currentUser,
                dept: currentDept,
                lastSeen: now,
                updatedAt: Date.now()
            };
            try {
                await fetch(`${DB_BASE}profiles/${currentUser.replace(/\s+/g, '_')}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
            } catch(e) { console.error(e); }
        }

        function toggleProfilesDrawer() {
            document.getElementById('profilesDrawer').classList.toggle('hidden');
        }

        // Fetch All Active Profiles & Friend Requests Status
        async function fetchProfiles() {
            try {
                const res = await fetch(`${DB_BASE}profiles.json`);
                allProfiles = await res.json() || {};
                
                const reqRes = await fetch(`${DB_BASE}friend_requests.json`);
                const allRequests = await reqRes.json() || {};

                const container = document.getElementById('profilesList');
                if(!allProfiles || Object.keys(allProfiles).length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center">No active profiles found.</p>`;
                    return;
                }

                let html = '';
                Object.keys(allProfiles).forEach(key => {
                    const prof = allProfiles[key];
                    if(prof.name === currentUser) return; // Skip self

                    // Check friend request status
                    const reqId = `${currentUser}_TO_${prof.name}`.replace(/\s+/g, '_');
                    const reverseReqId = `${prof.name}_TO_${currentUser}`.replace(/\s+/g, '_');
                    
                    let reqStatus = 'none';
                    if(allRequests[reqId]) reqStatus = allRequests[reqId].status;
                    if(allRequests[reverseReqId]) reqStatus = 'received_' + allRequests[reverseReqId].status;

                    let actionBtn = '';
                    if(reqStatus === 'pending') {
                        actionBtn = `<span class="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-lg border border-yellow-500/30">Request Sent</span>`;
                    } else if(reqStatus === 'accepted' || reqStatus === 'received_accepted') {
                        actionBtn = `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-lg border border-emerald-500/30"><i class="fa-solid fa-check"></i> Friends</span>`;
                    } else if(reqStatus.startsWith('received_pending')) {
                        actionBtn = `<button onclick="acceptFriendRequest('${prof.name}')" class="bg-emerald-600 text-white text-[10px] px-2.5 py-1 rounded-lg font-semibold">Accept</button>`;
                    } else {
                        actionBtn = `<button onclick="sendFriendRequest('${prof.name}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1"><i class="fa-solid fa-user-plus"></i> Add Friend</button>`;
                    }

                    html += `
                        <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl flex items-center justify-between">
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <h4 class="font-bold text-xs text-slate-200">${prof.name}</h4>
                                </div>
                                <p class="text-[10px] text-slate-400">${prof.dept || 'Member'}</p>
                                <p class="text-[9px] text-slate-500 mt-0.5">Last Seen: ${prof.lastSeen || 'Recently'}</p>
                            </div>
                            <div>${actionBtn}</div>
                        </div>
                    `;
                });

                container.innerHTML = html || `<p class="text-xs text-slate-500 text-center">Only you are live right now.</p>`;
            } catch(e) { console.error(e); }
        }

        async function sendFriendRequest(targetUser) {
            const reqId = `${currentUser}_TO_${targetUser}`.replace(/\s+/g, '_');
            const data = { from: currentUser, to: targetUser, status: 'pending', timestamp: Date.now() };
            await fetch(`${DB_BASE}friend_requests/${reqId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            fetchProfiles();
        }

        async function acceptFriendRequest(targetUser) {
            const reqId = `${targetUser}_TO_${currentUser}`.replace(/\s+/g, '_');
            await fetch(`${DB_BASE}friend_requests/${reqId}/status.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify('accepted')
            });
            fetchProfiles();
        }

        // Handle Gallery Photo Select and Upload
        function uploadFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                const newMsg = {
                    sender: currentUser,
                    dept: currentDept,
                    text: "📷 Shared a photo from gallery",
                    imageUrl: base64Image,
                    type: 'photo',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                await postToFirebase(newMsg);
            };
            reader.readAsDataURL(file);
        }

        // Fetch & Render Live Global Chat Feed
        async function fetchLiveChat() {
            try {
                const res = await fetch(`${DB_BASE}company_chat.json`);
                const data = await res.json();
                const container = document.getElementById('chatContainer');
                
                if (!data) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No live messages. Start the chat!</div>`;
                    return;
                }

                let html = '';
                Object.keys(data).forEach(id => {
                    const msg = data[id];
                    const isMe = msg.sender === currentUser;
                    
                    let contentHtml = '';
                    if(msg.type === 'photo') {
                        contentHtml = `
                            <div class="mb-2">
                                <img src="${msg.imageUrl}" alt="Shared photo" class="rounded-xl max-h-64 object-cover border border-slate-700/80 w-full">
                            </div>
                            <p class="text-xs text-slate-300">${msg.text}</p>
                        `;
                    } else {
                        contentHtml = `<p class="text-sm">${msg.text}</p>`;
                    }

                    html += `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3">
                            <div class="flex items-center space-x-2 mb-1 px-1">
                                <span class="text-xs font-semibold ${isMe ? 'text-emerald-400' : 'text-indigo-400'}">${msg.sender}</span>
                                <span class="text-[10px] text-slate-500">(${msg.dept || 'Member'}) • ${msg.timestamp || ''}</span>
                            </div>
                            <div class="max-w-[85%] sm:max-w-md rounded-2xl p-3.5 ${isMe ? 'bg-emerald-600/20 border border-emerald-500/30 text-slate-100 rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'} shadow-sm">
                                ${contentHtml}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            } catch (err) { console.error(err); }
        }

        async function sendMessage(e) {
            e.preventDefault();
            if(!currentUser) { openProfileModal(); return; }

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            const newMsg = {
                sender: currentUser,
                dept: currentDept,
                text: text,
                type: 'text',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            input.value = "";
            await postToFirebase(newMsg);
        }

        async function postToFirebase(data) {
            try {
                await fetch(`${DB_BASE}company_chat.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                fetchLiveChat();
            } catch (err) { alert("Failed to post: " + err.message); }
        }
    </script>
</body>
</html>
