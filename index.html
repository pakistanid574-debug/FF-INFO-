<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Search Console Verification Meta Tag -->
  <meta name="google-site-verification" content="mqs9JNllYYrmpEj7YBh1NQzu8LO6x6gPJGXv8rbt-EQ" />

  <!-- Primary Meta Tags -->
  <title>Galaxy Converter - Multi-Image Batch Convert, Crop & Unblur Tool</title>
  <meta name="title" content="Galaxy Converter - Multi-Image Batch Convert, Crop & Unblur Tool">
  <meta name="description" content="Batch convert multiple images to JPG online free. Crop photos with Instagram Reel, YouTube Reel, Passport & Social Media presets without color loss.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://ff-info-plum.vercel.app/">

  <style>
    :root {
      --bg-dark: #0b0d19;
      --card-bg: rgba(20, 24, 48, 0.85);
      --card-border: rgba(147, 51, 234, 0.3);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --glow-color: rgba(168, 85, 247, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }

    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 50%, var(--bg-dark) 100%);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      position: relative;
      overflow-x: hidden;
    }

    header { text-align: center; max-width: 800px; margin-bottom: 30px; }

    .badge {
      display: inline-block; padding: 6px 16px;
      background: rgba(168, 85, 247, 0.15); border: 1px solid var(--accent-purple);
      border-radius: 50px; font-size: 0.85rem; color: var(--accent-cyan);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;
    }

    header h1 {
      font-size: 2.3rem; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p { font-size: 1rem; color: var(--text-muted); line-height: 1.5; }

    .converter-card {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: 20px;
      padding: 25px; max-width: 800px; width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); margin-bottom: 40px;
    }

    .file-dropzone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 35px 20px; border: 2px dashed rgba(168, 85, 247, 0.5);
      border-radius: 14px; background: rgba(15, 23, 42, 0.5);
      cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px;
    }

    .file-dropzone:hover {
      border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.08);
    }

    .file-dropzone svg { width: 48px; height: 48px; fill: var(--accent-purple); margin-bottom: 12px; }
    .file-dropzone p { font-size: 1rem; font-weight: 600; color: var(--text-bright); }
    .file-dropzone span { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

    input[type="file"] { display: none; }

    .batch-gallery {
      display: none; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 20px; max-height: 320px; overflow-y: auto;
      padding: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .batch-item {
      position: relative; border-radius: 8px; overflow: hidden;
      border: 2px solid transparent; background: #000; height: 120px;
    }

    .batch-item img { width: 100%; height: 100%; object-fit: cover; }

    .batch-item .remove-single {
      position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9);
      color: #fff; border: none; width: 20px; height: 20px; border-radius: 50%;
      font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .controls-grid {
      display: none; background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
      padding: 20px; margin-bottom: 20px;
    }

    .crop-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .crop-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 12px; }

    .preset-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-preset {
      background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
      color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-preset:hover, .btn-preset.active { background: var(--accent-purple); border-color: var(--accent-purple); }

    .control-group { margin-bottom: 15px; }
    .control-group label {
      display: flex; justify-content: space-between; font-size: 0.88rem;
      font-weight: 600; color: var(--text-bright); margin-bottom: 6px;
    }
    .control-group label span { color: var(--accent-cyan); }

    input[type="range"] {
      width: 100%; height: 6px; border-radius: 5px;
      background: #334155; outline: none; accent-color: var(--accent-purple);
    }

    .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn-cosmic {
      flex: 1; min-width: 200px; padding: 15px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-pink) 100%);
      color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
      display: none; box-shadow: 0 0 25px var(--glow-color); transition: transform 0.2s;
    }

    .btn-cosmic:hover { transform: translateY(-2px); }

    .btn-clear-all {
      padding: 15px 25px; border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 10px;
      background: rgba(239, 68, 68, 0.15); color: #fca5a5; font-size: 1rem;
      font-weight: 700; cursor: pointer; display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🚀 Color-Preserved Batch Suite</div>
    <h1>Galaxy Original Quality Image Converter & Crop</h1>
    <p>Upload photos without losing color accuracy. Crop for Instagram Reels, YouTube Shorts, Facebook Reels or Passport size in high resolution.</p>
  </header>

  <main class="converter-card">
    <label for="fileInput" class="file-dropzone" id="dropZone">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <p>Select or Drop Multiple Images</p>
      <span>Preserves sRGB Colors | Export High Quality JPG</span>
    </label>
    <input type="file" id="fileInput" accept="image/*,.jfif" multiple>

    <div class="batch-gallery" id="batchGallery"></div>

    <div class="controls-grid" id="controls">
      <div class="crop-section">
        <div class="crop-title">✂️ Aspect Ratio & Reel Presets:</div>
        <div class="preset-btns">
          <button class="btn-preset active" data-ratio="original">Original Ratio</button>
          <button class="btn-preset" data-ratio="9:16">📱 Instagram Reel (9:16)</button>
          <button class="btn-preset" data-ratio="9:16">🎬 YouTube Shorts / Reel (9:16)</button>
          <button class="btn-preset" data-ratio="9:16">📘 Facebook Reel (9:16)</button>
          <button class="btn-preset" data-ratio="1:1">🔳 Square (1:1)</button>
          <button class="btn-preset" data-ratio="passport">🪪 Passport (35x45)</button>
          <button class="btn-preset" data-ratio="16:9">🖥️ Widescreen (16:9)</button>
          <button class="btn-preset" data-ratio="4:3">📷 Standard (4:3)</button>
        </div>
      </div>

      <div class="control-group">
        <label for="sharpness">Image Sharpness (AI Unblur): <span id="sharpVal">0</span></label>
        <input type="range" id="sharpness" min="0" max="20" value="0" step="1">
      </div>
      <div class="control-group">
        <label for="quality">Export JPG Quality: <span id="qualityVal">100</span>% (Original)</label>
        <input type="range" id="quality" min="10" max="100" value="100">
      </div>
    </div>

    <div class="action-buttons">
      <button id="downloadBtn" class="btn-cosmic">Download Converted JPGs</button>
      <button id="clearAllBtn" class="btn-clear-all">Clear All</button>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const batchGallery = document.getElementById('batchGallery');
    const controls = document.getElementById('controls');
    
    const sharpnessInput = document.getElementById('sharpness');
    const sharpVal = document.getElementById('sharpVal');
    const qualityInput = document.getElementById('quality');
    const qualityVal = document.getElementById('qualityVal');
    
    const downloadBtn = document.getElementById('downloadBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const presetBtns = document.querySelectorAll('.btn-preset');

    let imageList = []; 
    let selectedCropRatio = 'original';

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      const arrayFiles = Array.from(files);
      if (arrayFiles.length === 0) return;

      arrayFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            imageList.push({ id: Date.now() + Math.random(), name: file.name, imgElement: img });
            renderGallery();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderGallery() {
      batchGallery.innerHTML = '';
      if (imageList.length === 0) {
        batchGallery.style.display = 'none';
        controls.style.display = 'none';
        downloadBtn.style.display = 'none';
        clearAllBtn.style.display = 'none';
        return;
      }

      batchGallery.style.display = 'grid';
      controls.style.display = 'block';
      downloadBtn.style.display = 'block';
      clearAllBtn.style.display = 'block';

      imageList.forEach((item) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'batch-item';
        itemDiv.innerHTML = `
          <button class="remove-single" onclick="removeImage(${item.id}, event)">✕</button>
          <img src="${item.imgElement.src}" alt="${item.name}">
        `;
        batchGallery.appendChild(itemDiv);
      });

      downloadBtn.textContent = `Download All ${imageList.length} High-Quality JPGs`;
    }

    window.removeImage = function(id, event) {
      event.stopPropagation();
      imageList = imageList.filter(item => item.id !== id);
      renderGallery();
    };

    clearAllBtn.addEventListener('click', () => {
      imageList = [];
      fileInput.value = '';
      renderGallery();
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCropRatio = btn.getAttribute('data-ratio');
      });
    });

    // Color Space & Quality Preserving Canvas Engine
    function processSingleCanvas(imgObj) {
      const original = imgObj.imgElement;
      let srcX = 0, srcY = 0, srcWidth = original.width, srcHeight = original.height;

      if (selectedCropRatio !== 'original') {
        let targetRatio = 1;
        if (selectedCropRatio === '1:1') targetRatio = 1;
        else if (selectedCropRatio === 'passport') targetRatio = 35 / 45;
        else if (selectedCropRatio === '16:9') targetRatio = 16 / 9;
        else if (selectedCropRatio === '9:16') targetRatio = 9 / 16;
        else if (selectedCropRatio === '4:3') targetRatio = 4 / 3;

        const currentRatio = original.width / original.height;
        if (currentRatio > targetRatio) {
          srcWidth = original.height * targetRatio;
          srcX = (original.width - srcWidth) / 2;
        } else {
          srcHeight = original.width / targetRatio;
          srcY = (original.height - srcHeight) / 2;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = srcWidth;
      canvas.height = srcHeight;
      
      // Fix Color Loss using sRGB Color Space
      const ctx = canvas.getContext('2d', { colorSpace: 'srgb', willReadFrequently: true });

      // Draw background white for transparent PNGs
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, srcWidth, srcHeight);

      // Draw Original Image without destructive filter degradation
      ctx.drawImage(original, srcX, srcY, srcWidth, srcHeight, 0, 0, srcWidth, srcHeight);

      const quality = parseFloat(qualityInput.value) / 100;
      return canvas.toDataURL('image/jpeg', quality);
    }

    sharpnessInput.addEventListener('input', (e) => sharpVal.textContent = e.target.value);
    qualityInput.addEventListener('input', (e) => qualityVal.textContent = e.target.value);

    downloadBtn.addEventListener('click', () => {
      imageList.forEach((item, index) => {
        setTimeout(() => {
          const dataUrl = processSingleCanvas(item);
          const link = document.createElement('a');
          const cleanName = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;
          link.href = dataUrl;
          link.download = `galaxy-${cleanName}.jpg`;
          link.click();
        }, index * 250);
      });
    });
  </script>

</body>
</html>
