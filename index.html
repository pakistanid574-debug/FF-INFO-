<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpSec - Direct Chat & Profiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darker: '#0f172a', card: '#1e293b' }
                }
            }
        }
    </script>
</head>
<body class="bg-darker text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div id="myHeaderAvatar" class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-white overflow-hidden border border-emerald-500/30">
                <i class="fa-solid fa-user text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight flex items-center gap-2">
                    <span id="chatTitleHeader">Global Room</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Live Sync</span>
                </h1>
                <p class="text-xs text-slate-400" id="currentProfileDisplay">Profile: Not Set</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchChatRoom('global')" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-2 rounded-xl font-medium transition-all hidden" id="backToGlobalBtn">
                <i class="fa-solid fa-globe"></i> Global
            </button>
            <button onclick="toggleProfilesDrawer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl border border-slate-700 font-medium transition-all flex items-center space-x-1.5">
                <i class="fa-solid fa-user-group text-emerald-400"></i>
                <span>Profiles</span>
            </button>
            <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-slate-700 text-xs p-2 rounded-xl border border-slate-700 text-slate-300">
                <i class="fa-solid fa-user-gear"></i>
            </button>
        </div>
    </header>

    <!-- Main Live Chat Area -->
    <main id="chatContainer" class="flex-grow overflow-y-auto p-4 space-y-4 bg-slate-950/50">
        <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-500"></i>
            <p class="text-sm">Connecting to live cloud network...</p>
        </div>
    </main>

    <!-- Message & Gallery Upload Input Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 flex flex-col gap-2">
        <form id="chatForm" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex items-center gap-2 w-full">
            <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-3 rounded-xl border border-slate-700 transition-all flex items-center justify-center cursor-pointer" title="Upload from Gallery">
                <i class="fa-solid fa-paperclip text-emerald-400"></i>
                <input type="file" id="galleryFileInput" accept="image/*" class="hidden" onchange="uploadFromGallery(event)">
            </label>

            <input type="text" id="messageInput" autocomplete="off" placeholder="Type a message..." class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
            
            <button type="submit" id="sendBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-semibold text-sm shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- Footer Branding -->
        <div class="text-center text-[11px] text-slate-400 font-medium tracking-wide">
            Design By <span class="text-emerald-400 font-bold">Hassan Alvi</span>
        </div>
    </footer>

    <!-- Active Profiles & Direct Chat Drawer -->
    <div id="profilesDrawer" class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border-l border-slate-800 w-full max-w-sm h-full p-5 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <i class="fa-solid fa-address-book text-emerald-400"></i> Live Profiles & Chat
                    </h3>
                    <button onclick="toggleProfilesDrawer()" class="text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div id="profilesList" class="space-y-3 overflow-y-auto max-h-[75vh]">
                    <p class="text-xs text-slate-500 text-center">Loading profiles...</p>
                </div>
            </div>
            <div class="text-xs text-slate-500 text-center border-t border-slate-800 pt-3">
                Tap profile to direct chat
            </div>
        </div>
    </div>

    <!-- Profile Setup & Edit Modal -->
    <div id="profileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl m-4">
            <h3 class="text-lg font-bold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-emerald-400"></i> Edit Profile Details
            </h3>
            <p class="text-xs text-slate-400 mb-4">Update your name, role, and profile picture URL.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Full Name</label>
                    <input type="text" id="userNameInput" placeholder="e.g. Ali" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Role / Department</label>
                    <input type="text" id="userDeptInput" placeholder="e.g. Operations Manager" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Profile Picture (Image URL)</label>
                    <input type="text" id="userAvatarInput" placeholder="https://example.com/my-photo.jpg" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500">
                </div>
                <button type="button" onclick="saveProfile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-semibold text-sm mt-2 transition-all">
                    Save Profile
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Realtime Engine -->
    <script>
        const DB_BASE = "https://gigpulse-app-default-rtdb.firebaseio.com/";
        
        let currentUser = localStorage.getItem('corp_user_name') || "";
        let currentDept = localStorage.getItem('corp_user_dept') || "";
        let currentAvatar = localStorage.getItem('corp_user_avatar') || "";
        let activeChatTarget = "global";
        let allProfiles = {};

        window.onload = function() {
            if (!currentUser) {
                openProfileModal();
            } else {
                updateProfileDisplay();
                updateUserHeartbeat();
            }
            fetchMessages();
            fetchProfiles();
            
            setInterval(fetchMessages, 2500);
            setInterval(fetchProfiles, 5000);
            setInterval(updateUserHeartbeat, 15000);
        };

        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
            if(currentUser) document.getElementById('userNameInput').value = currentUser;
            if(currentDept) document.getElementById('userDeptInput').value = currentDept;
            if(currentAvatar) document.getElementById('userAvatarInput').value = currentAvatar;
        }

        async function saveProfile() {
            const name = document.getElementById('userNameInput').value.trim();
            const dept = document.getElementById('userDeptInput').value.trim();
            const avatar = document.getElementById('userAvatarInput').value.trim();
            if(!name) { alert("Please enter your name!"); return; }
            
            currentUser = name;
            currentDept = dept || "Member";
            currentAvatar = avatar || "";

            localStorage.setItem('corp_user_name', currentUser);
            localStorage.setItem('corp_user_dept', currentDept);
            localStorage.setItem('corp_user_avatar', currentAvatar);

            updateProfileDisplay();
            await updateUserHeartbeat();
            document.getElementById('profileModal').classList.add('hidden');
            fetchMessages();
        }

        function updateProfileDisplay() {
            document.getElementById('currentProfileDisplay').innerText = `${currentUser} (${currentDept})`;
            const avatarContainer = document.getElementById('myHeaderAvatar');
            if(currentAvatar) {
                avatarContainer.innerHTML = `<img src="${currentAvatar}" class="w-full h-full object-cover">`;
            } else {
                avatarContainer.innerHTML = `<span class="text-xs font-bold">${currentUser.charAt(0).toUpperCase()}</span>`;
            }
        }

        async function updateUserHeartbeat() {
            if(!currentUser) return;
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const profileData = {
                name: currentUser,
                dept: currentDept,
                avatar: currentAvatar,
                lastSeen: now,
                updatedAt: Date.now()
            };
            try {
                await fetch(`${DB_BASE}profiles/${currentUser.replace(/\s+/g, '_')}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
            } catch(e) { console.error(e); }
        }

        function toggleProfilesDrawer() {
            document.getElementById('profilesDrawer').classList.toggle('hidden');
        }

        async function fetchProfiles() {
            try {
                const res = await fetch(`${DB_BASE}profiles.json`);
                allProfiles = await res.json() || {};

                const container = document.getElementById('profilesList');
                let html = '';
                Object.keys(allProfiles).forEach(key => {
                    const prof = allProfiles[key];
                    if(prof.name === currentUser) return;

                    const avatarHtml = prof.avatar ? 
                        `<img src="${prof.avatar}" class="w-9 h-9 rounded-xl object-cover border border-slate-700">` : 
                        `<div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-emerald-400 text-xs">${prof.name.charAt(0)}</div>`;

                    html += `
                        <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                ${avatarHtml}
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <h4 class="font-bold text-xs text-slate-200">${prof.name}</h4>
                                    </div>
                                    <p class="text-[10px] text-slate-400">${prof.dept}</p>
                                    <p class="text-[9px] text-slate-500 mt-0.5">Last seen: ${prof.lastSeen || 'Active'}</p>
                                </div>
                            </div>
                            <button onclick="startDirectChat('${prof.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-xl font-semibold shadow-md flex items-center gap-1.5">
                                <i class="fa-solid fa-comment-dots"></i> Chat
                            </button>
                        </div>
                    `;
                });

                container.innerHTML = html || `<p class="text-xs text-slate-500 text-center">No other profiles online.</p>`;
            } catch(e) { console.error(e); }
        }

        function startDirectChat(targetName) {
            activeChatTarget = targetName;
            document.getElementById('chatTitleHeader').innerText = `Chat with ${targetName}`;
            document.getElementById('backToGlobalBtn').classList.remove('hidden');
            toggleProfilesDrawer();
            fetchMessages();
        }

        function switchChatRoom(room) {
            activeChatTarget = room;
            document.getElementById('chatTitleHeader').innerText = "Global Room";
            document.getElementById('backToGlobalBtn').classList.add('hidden');
            fetchMessages();
        }

        function uploadFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                const newMsg = {
                    sender: currentUser,
                    dept: currentDept,
                    avatar: currentAvatar,
                    text: "📷 Shared photo",
                    imageUrl: base64Image,
                    type: 'photo',
                    recipient: activeChatTarget,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                await postToFirebase(newMsg);
            };
            reader.readAsDataURL(file);
        }

        async function fetchMessages() {
            try {
                let endpoint = activeChatTarget === 'global' ? 
                    `${DB_BASE}company_chat.json` : 
                    `${DB_BASE}direct_chats.json`;

                const res = await fetch(endpoint);
                const data = await res.json();
                const container = document.getElementById('chatContainer');
                
                if (!data) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No messages yet. Start conversation!</div>`;
                    return;
                }

                let html = '';
                Object.keys(data).forEach(id => {
                    const msg = data[id];

                    if(activeChatTarget !== 'global') {
                        const isRelevant = (msg.sender === currentUser && msg.recipient === activeChatTarget) || 
                                           (msg.sender === activeChatTarget && msg.recipient === currentUser);
                        if(!isRelevant) return;
                    }

                    const isMe = msg.sender === currentUser;
                    
                    let contentHtml = '';
                    if(msg.type === 'photo') {
                        contentHtml = `
                            <div class="mb-2">
                                <img src="${msg.imageUrl}" class="rounded-xl max-h-60 object-cover border border-slate-700 w-full">
                            </div>
                            <p class="text-xs text-slate-300">${msg.text}</p>
                        `;
                    } else {
                        contentHtml = `<p class="text-sm">${msg.text}</p>`;
                    }

                    const avatarHtml = msg.avatar ? 
                        `<img src="${msg.avatar}" class="w-7 h-7 rounded-full object-cover">` : 
                        `<div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center font-bold text-[10px] text-emerald-400">${msg.sender.charAt(0)}</div>`;

                    html += `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3">
                            <div class="flex items-center space-x-1.5 mb-1 px-1">
                                ${!isMe ? avatarHtml : ''}
                                <span class="text-xs font-semibold ${isMe ? 'text-emerald-400' : 'text-indigo-400'}">${msg.sender}</span>
                                <span class="text-[10px] text-slate-500">• ${msg.timestamp || ''}</span>
                            </div>
                            <div class="max-w-[85%] sm:max-w-md rounded-2xl p-3.5 ${isMe ? 'bg-emerald-600/20 border border-emerald-500/30 text-slate-100 rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'} shadow-sm">
                                ${contentHtml}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html || `<div class="text-center py-12 text-slate-500 text-sm">No direct messages with ${activeChatTarget} yet.</div>`;
                container.scrollTop = container.scrollHeight;
            } catch (err) { console.error(err); }
        }

        async function sendMessage(e) {
            e.preventDefault();
            if(!currentUser) { openProfileModal(); return; }

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            const newMsg = {
                sender: currentUser,
                dept: currentDept,
                avatar: currentAvatar,
                recipient: activeChatTarget,
                text: text,
                type: 'text',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            input.value = "";
            await postToFirebase(newMsg);
        }

        async function postToFirebase(data) {
            let endpoint = activeChatTarget === 'global' ? 
                `${DB_BASE}company_chat.json` : 
                `${DB_BASE}direct_chats.json`;

            try {
                await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                fetchMessages();
            } catch (err) { alert("Failed to send: " + err.message); }
        }
    </script>
</body>
</html>
