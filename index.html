<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JFIF to JPG Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .converter-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .file-input-label {
      display: block;
      padding: 15px;
      background: #eef2ff;
      border: 2px dashed #4f46e5;
      border-radius: 8px;
      color: #4f46e5;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }
    .file-input-label:hover {
      background: #e0e7ff;
    }
    input[type="file"] {
      display: none;
    }
    #preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .btn {
      background-color: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: none;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <h2>JFIF to JPG Converter</h2>
    
    <label for="fileInput" class="file-input-label">
      Choose JFIF Image
    </label>
    <input type="file" id="fileInput" accept=".jfif,image/jpeg">

    <img id="preview" alt="Preview">

    <button id="downloadBtn" class="btn">Download as JPG</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    let convertedImageDataUrl = '';

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Canvas rendering logic to convert format
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          // Export as JPG data URL
          convertedImageDataUrl = canvas.toDataURL('image/jpeg', 0.9);

          // Update UI
          preview.src = convertedImageDataUrl;
          preview.style.display = 'block';
          downloadBtn.style.display = 'block';
        };
        img.src = event.target.result;
      };

      reader.readAsDataURL(file);
    });

    downloadBtn.addEventListener('click', () => {
      if (!convertedImageDataUrl) return;

      const link = document.createElement('a');
      link.href = convertedImageDataUrl;
      link.download = 'converted-image.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>

</body>
</html>
