<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobePulse - Global Social Feed</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">GlobePulse 🌐</div>
    <div id="user-nav">
      <span id="user-display"></span>
      <button id="logout-btn" style="display:none;">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Auth Section (Signup / Login) -->
    <div id="auth-section" class="card">
      <h2 id="auth-title">Login to GlobePulse</h2>
      <input type="text" id="username" placeholder="Username (for signup)" style="display:none;">
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button id="auth-submit-btn">Login</button>
      <p class="toggle-auth">
        <span id="auth-toggle-text">Don't have an account?</span> 
        <a href="#" id="toggle-auth-btn">Sign Up</a>
      </p>
    </div>

    <!-- Feed & Post Section -->
    <div id="app-section" class="card" style="display:none;">
      <!-- Post Creation Box -->
      <div class="create-post">
        <h3>Create a Post</h3>
        <textarea id="post-content" placeholder="What's happening globally?..."></textarea>
        <button id="publish-btn">Post Globally</button>
      </div>

      <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #334155;">

      <!-- Global Posts Feed -->
      <h3>Global Feed</h3>
      <div id="posts-feed">
        <p>Loading posts...</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
